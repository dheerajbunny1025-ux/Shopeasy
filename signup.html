<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - ShopEase</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <a href="../index.html">
                ShopEase
            </a>
        </div>

        <nav class="navbar">

            <a href="../index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Create Account</h1>

                <p>
                    Join ShopEase and start shopping.
                </p>

            </div>


            <form id="signupForm" class="auth-form">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="terms-group">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


                <p
                    id="signupMessage"
                    class="auth-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-bottom">

            <p>
                &copy; 2026 ShopEase. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="../auth.js"></script>

</body>

</html>
